name: patuh consistency gate

# Family hygiene checks from irvan-putra/patuh for this web project:
# README, LICENSE drift, commit author, naming. Runs on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@3d9be2e1d971e3f9e3f748a2fb04931951e9f974
    with:
      app: kunjung
      published: false
